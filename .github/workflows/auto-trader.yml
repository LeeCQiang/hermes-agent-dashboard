name: AI-Trader Auto Bot

on:
  schedule:
    # 每 30 分钟运行一次（UTC时间，+8小时=北京时间）
    - cron: '*/30 * * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 执行交易机器人
        env:
          AI_TRADER_TOKEN: ${{ secrets.AI_TRADER_TOKEN }}
        continue-on-error: true
        run: python ai-trader-bot.py || echo "API暂时不可用，下次再试"
