name: BTC Trader

on:
  schedule:
    # 每 2 小时运行一次（UTC时间，+8小时=北京时间）
    - cron: '0 */2 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 执行 BTC 策略交易机器人
        env:
          AI_TRADER_TOKEN: ${{ secrets.AI_TRADER_TOKEN }}
        continue-on-error: true
        run: python btc-trader.py || echo "❌ 本次交易异常，下次再试"
