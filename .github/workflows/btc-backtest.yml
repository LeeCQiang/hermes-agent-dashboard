name: BTC Data & Backtest

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests
      - name: 数据采集 + 策略回测
        run: python btc-backtest.py
